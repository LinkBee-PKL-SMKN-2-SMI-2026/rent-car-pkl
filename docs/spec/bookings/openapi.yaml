openapi: 3.1.0
info:
  title: Bookings API
  version: 1.0.0
  description: Booking module — public price calculator and booking creation (WhatsApp flow), authenticated management
servers:
  - url: http://localhost:3000/api
    description: Local development

security:
  - BearerAuth: []

paths:
  /bookings/estimate:
    post:
      summary: Estimate booking price
      description: Public endpoint. Server-side price calculation based on rental duration and rates. Returns per-item breakdown.
      tags:
        - Bookings
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateBookingRequest"
      responses:
        "200":
          description: Price estimate
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PriceSummary"
        "400":
          description: Invalid dates or unknown vehicle/rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings:
    post:
      summary: Create a booking
      description: Public endpoint. Creates a booking (PENDING) and finds or creates the customer by phone. Prices are recalculated server-side.
      tags:
        - Bookings
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Booking"
                          - type: object
                            properties:
                              priceSummary:
                                $ref: "#/components/schemas/PriceSummary"
        "400":
          description: Invalid dates, customer info missing, or unknown vehicle/rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: List bookings
      description: Requires authentication. Paginated list with customer and vehicle items.
      tags:
        - Bookings
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: search
          in: query
          schema:
            type: string
          description: Search by booking code, customer name, or phone
        - name: sort
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort by creation date
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, CONFIRMED, ONGOING, COMPLETED, CANCELLED]
          description: Filter by status
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
          description: Filter bookings starting from this date
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
          description: Filter bookings starting until this date
      responses:
        "200":
          description: Paginated booking list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Booking"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /bookings/{id}:
    get:
      summary: Get booking by ID
      description: Requires authentication. Includes customer, creator, and vehicle items.
      tags:
        - Bookings
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Booking"
                          - type: object
                            properties:
                              createdByUser:
                                $ref: "#/components/schemas/UserRef"
                              items:
                                type: array
                                items:
                                  allOf:
                                    - $ref: "#/components/schemas/BookingItem"
                                    - type: object
                                      properties:
                                        vehicle:
                                          $ref: "#/components/schemas/VehicleRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete a booking
      description: Requires ADMIN or STAFF role. Cannot delete ONGOING or COMPLETED bookings.
      tags:
        - Bookings
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Booking deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Booking"
        "400":
          description: Booking is ONGOING or COMPLETED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}/status:
    patch:
      summary: Update booking status
      description: "Requires ADMIN or STAFF role. Allowed transitions: PENDING->CONFIRMED/CANCELLED, CONFIRMED->ONGOING/CANCELLED, ONGOING->COMPLETED."
      tags:
        - Bookings
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Booking"
        "400":
          description: Status already set or invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token returned by login

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: Items per page
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Booking ID

  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient role (requires ADMIN or STAFF)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          description: Response payload
      required:
        - success
        - message

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object
          description: Field-level validation errors
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - success
        - message

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required:
        - page
        - limit
        - total
        - totalPages

    CustomerInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          description: Customer name (min 2 characters)
        phone:
          type: string
          minLength: 8
          description: Phone number (min 8 characters)
        email:
          type: string
          format: email
        address:
          type: string
        companyName:
          type: string
      required:
        - name
        - phone

    BookingItemInput:
      type: object
      required:
        - vehicleId
      properties:
        vehicleId:
          type: string
          format: uuid
          description: Vehicle ID
        needsDriver:
          type: boolean
          default: false
          description: Whether the rental includes a driver

    EstimateBookingRequest:
      type: object
      required:
        - items
        - startDate
        - endDate
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BookingItemInput"
        startDate:
          type: string
          format: date-time
          description: Rental start date
        endDate:
          type: string
          format: date-time
          description: Rental end date (must be after start date)

    CreateBookingRequest:
      type: object
      required:
        - items
        - startDate
        - endDate
      properties:
        customerId:
          type: string
          format: uuid
          description: Existing customer ID (optional if customer object provided)
        customer:
          $ref: "#/components/schemas/CustomerInput"
          description: Customer data (optional if customerId provided)
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BookingItemInput"
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        pickupLocation:
          type: string
        dropoffLocation:
          type: string
        needsFuel:
          type: boolean
          default: false
        notes:
          type: string
      description: Either customerId or customer is required

    UpdateStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [PENDING, CONFIRMED, ONGOING, COMPLETED, CANCELLED]

    PriceItem:
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
        vehicleName:
          type: string
        durationType:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY]
        days:
          type: integer
          description: Number of duration units billed
        multiplier:
          type: number
          description: Duration multiplier (1 for DAILY, 7 for WEEKLY, 30 for MONTHLY)
        unitPrice:
          type: number
          format: decimal
        subtotal:
          type: number
          format: decimal
        needsDriver:
          type: boolean
      required:
        - vehicleId
        - vehicleName
        - durationType
        - days
        - multiplier
        - unitPrice
        - subtotal
        - needsDriver

    PriceSummary:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PriceItem"
        basePrice:
          type: number
          format: decimal
        totalPrice:
          type: number
          format: decimal
      required:
        - items
        - basePrice
        - totalPrice

    UserRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
      required:
        - id
        - name
        - email

    CustomerRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        companyName:
          type: string
          nullable: true
      required:
        - id
        - name
        - phone

    VehicleRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plateNumber:
          type: string
        brand:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
      required:
        - id
        - name
        - plateNumber

    BookingItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        durationType:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY]
        days:
          type: integer
        unitPrice:
          type: number
          format: decimal
        subtotal:
          type: number
          format: decimal
      required:
        - id
        - bookingId
        - vehicleId
        - durationType
        - days
        - unitPrice
        - subtotal

    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingCode:
          type: string
          description: Unique booking code (e.g. RC-20260001)
        customerId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
          nullable: true
          description: Admin/Staff user who created it (null for public bookings)
        status:
          type: string
          enum: [PENDING, CONFIRMED, ONGOING, COMPLETED, CANCELLED]
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        pickupLocation:
          type: string
          nullable: true
        dropoffLocation:
          type: string
          nullable: true
        needsDriver:
          type: boolean
        needsFuel:
          type: boolean
        basePrice:
          type: number
          format: decimal
        totalPrice:
          type: number
          format: decimal
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        customer:
          $ref: "#/components/schemas/CustomerRef"
        items:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/BookingItem"
              - type: object
                properties:
                  vehicle:
                    $ref: "#/components/schemas/VehicleRef"
      required:
        - id
        - bookingCode
        - customerId
        - status
        - startDate
        - endDate
        - needsDriver
        - needsFuel
        - basePrice
        - totalPrice
        - createdAt
        - updatedAt
