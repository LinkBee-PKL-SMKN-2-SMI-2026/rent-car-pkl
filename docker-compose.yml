services:
  db:
    image: postgres:16-alpine
    container_name: rent-car-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rent_car
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rent_car"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
